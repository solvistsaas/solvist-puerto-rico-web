        - heading "El mercado cambió. Los instaladores que actúen primero, ganan." [level=2] [ref=e733]
        - paragraph [ref=e734]: Puerto Rico tiene condiciones únicas que hacen que las instalaciones de 2019–2022 representen hoy una oportunidad que no existía hace cuatro años. Aquí está la evidencia.
