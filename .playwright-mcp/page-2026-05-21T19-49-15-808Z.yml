          - paragraph [ref=e741]: Las baterías LFP bajaron de $800 a $400/kWh. Con el ITC al 30%, el coste neto es de ~$234/kWh. El payback real es de 4 a 7 años. Tu competencia ya lo usa como argumento de venta.
          - paragraph [ref=e743]: "💡 Clientes en tarifa GSP con 50 kVA: el cargo de demanda LUMA es de ~$400/mes. Se elimina con una batería correctamente dimensionada."
