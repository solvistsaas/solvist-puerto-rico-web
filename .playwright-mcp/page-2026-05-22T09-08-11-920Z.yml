        - paragraph [ref=e421]: POR QUÉ AHORA EN PUERTO RICO
        - heading "El mercado cambió. Los instaladores que actúen primero, ganan." [level=2] [ref=e422]
        - paragraph [ref=e423]: Puerto Rico tiene condiciones únicas que hacen que las instalaciones de 2019–2022 representen hoy una oportunidad que no existía hace cuatro años. Aquí está la evidencia.
